<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIA Plot Example - Forestry 3D</title>

  <!-- CCapture for video recording -->
  <script src="https://unpkg.com/ccapture.js@1.1.0/build/CCapture.all.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #f0f0f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      z-index: 10;
      max-width: 300px;
      pointer-events: none;
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 1.1rem;
      color: #1a1a1a;
    }

    p {
      margin: 0;
      font-size: 0.85rem;
      color: #666;
      line-height: 1.4;
    }

    .legend {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }

    .color-box {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }
  </style>
</head>

<body>
  <div id="info">
    <h1>Capture Ready</h1>
    <p>Press <b>R</b> to start recording.<br>Press <b>S</b> to stop & save (GIF).</p>
  </div>
  <script type="module" src="./fia_plot.js"></script>
</body>

</html>
