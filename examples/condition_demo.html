<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Condition Demo - Forestry 3D</title>

  <!-- CCapture for video recording -->
  <script src="https://unpkg.com/ccapture.js@1.1.0/build/CCapture.all.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #f0f0f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      pointer-events: none;
    }

    .layout {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      z-index: 10;
      pointer-events: none;
      /* Let clicks pass through to the canvas */
    }

    .main-view-container {
      flex: 1;
      position: relative;
      pointer-events: auto;
      /* Enable controls on main view */
    }

    .sidebar {
      width: 450px;
      background: rgba(255, 255, 255, 0.95);
      border-left: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
      pointer-events: auto;
      overflow-y: auto;
      box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #333;
    }

    .subplots-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 25px;
    }

    .subplot-panel {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .subplot-title {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #555;
    }

    .subplot-view {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: rgba(0, 0, 0, 0.05);
      /* Placeholder empty background */
      border-radius: 4px;
      overflow: hidden;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .data-table th,
    .data-table td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    .data-table th {
      background: #f5f5f5;
      color: #333;
    }

    .data-table tr:nth-child(even) {
      background: #fafafa;
    }
  </style>
</head>

<body>
  <!-- Canvas is placed here -->
  <div id="canvas-container"></div>

  <div class="layout">
    <div class="main-view-container" id="main-view">
      <!-- Top-level controls or info can go here -->
    </div>

    <div class="sidebar">
      <h2>Subplot Views</h2>
      <div class="subplots-grid">
        <div class="subplot-panel">
          <div class="subplot-title">Subplot 1 (Center)</div>
          <div class="subplot-view" id="view-subplot-1"></div>
        </div>
        <div class="subplot-panel">
          <div class="subplot-title">Subplot 2 (North)</div>
          <div class="subplot-view" id="view-subplot-2"></div>
        </div>
        <div class="subplot-panel">
          <div class="subplot-title">Subplot 3 (Southeast)</div>
          <div class="subplot-view" id="view-subplot-3"></div>
        </div>
        <div class="subplot-panel">
          <div class="subplot-title">Subplot 4 (Southwest)</div>
          <div class="subplot-view" id="view-subplot-4"></div>
        </div>
      </div>

      <h2>Condition Proportions</h2>
      <table class="data-table" id="condition-table">
        <thead>
          <tr>
            <th>Subplot</th>
            <th>Green Area</th>
            <th>Water Area</th>
          </tr>
        </thead>
        <tbody>
          <!-- Populated via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="./condition_demo.js"></script>
</body>

</html>
