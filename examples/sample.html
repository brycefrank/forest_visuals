<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample - Forestry 3D</title>

  <!-- CCapture for video recording -->
  <script src="https://unpkg.com/ccapture.js@1.1.0/build/CCapture.all.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #f0f0f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      pointer-events: none;
    }

    .layout {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      z-index: 10;
      pointer-events: none;
    }

    .main-view-container {
      flex: 1;
      position: relative;
      pointer-events: auto;
    }

    .sidebar {
      width: 400px;
      background: rgba(255, 255, 255, 0.95);
      border-left: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
      pointer-events: auto;
      overflow-y: auto;
      box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #333;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .data-table th,
    .data-table td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    .data-table th {
      background: #f5f5f5;
      color: #333;
    }

    .data-table tr:nth-child(even) {
      background: #fafafa;
    }

    #info-card {
      position: absolute;
      top: 20px;
      left: 20px;
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 300px;
      pointer-events: none;
      z-index: 200;
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 1.1rem;
      color: #1a1a1a;
    }

    p {
      margin: 0;
      font-size: 0.85rem;
      color: #666;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div id="canvas-container"></div>

  <div class="layout">
    <div class="main-view-container" id="main-view">
      <div id="info-card">
        <h1>Grid Capture Ready</h1>
        <p>Press <b>R</b> to start recording.<br>Press <b>S</b> to stop & save (GIF).</p>
      </div>
    </div>

    <div class="sidebar">
      <h2>Plot Statistics</h2>
      <table class="data-table" id="plot-table">
        <thead>
          <tr>
            <th>Plot ID</th>
            <th>Total Trees</th>
            <th>EST TPA</th>
          </tr>
        </thead>
        <tbody>
          <!-- Populated via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="./sample.js"></script>
</body>

</html>
